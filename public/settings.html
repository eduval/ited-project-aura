<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <title>AURA</title>
    <meta name="description" content="AURA">
    <meta name="viewport" content="width=device-width, maximum-scale=5, initial-scale=1">

    <!-- perf & fonts -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com/">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com/">
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/">
    <link rel="preload" href="assets/fonts/flaticon/Flaticon.woff2" as="font" type="font/woff2" crossorigin>

    <!-- theme css -->
    <link rel="stylesheet" href="assets/css/core.min.css">
    <link rel="stylesheet" href="assets/css/vendor_bundle.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap">
    <link rel="shortcut icon" href="favicon.ico">

    <style>
        /* ——— small polish to match your old look ——— */
        :root {
            --card-radius: .8rem;
            --soft-border: #eef0f4;
        }

        .page-wrap {
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            border-radius: var(--card-radius);
            border-color: var(--soft-border);
        }

        .card-header {
            border-bottom: 1px solid var(--soft-border);
        }

        .section {
            padding-left: .25rem;
            padding-right: .25rem;
        }

        .logo-preview {
            width: 120px;
            height: 60px;
            object-fit: contain;
            background: #fff;
            border: 1px solid #eee;
            border-radius: .5rem
        }

        .fi-arrow-down {
            display: inline-block;
            transition: transform .2s ease;
        }

        .rotated {
            transform: rotate(180deg);
        }

        .d-none {
            display: none !important;
        }

        /* Keep inputs compact and aligned */
        .form-label {
            font-weight: 500;
        }
    </style>
    <div id="global-header"></div>

</head>

<body class="layout-admin layout-padded aside-sticky">
    <div id="wrapper" class="d-flex align-items-stretch flex-column">

        <!-- header -->
        <header id="header" class="d-flex align-items-center bg-transparent">

            <!-- Navbar -->
            <div class="px-3 px-lg-0 w-100 position-relative">
                <nav class="navbar navbar-expand-lg navbar-light justify-content-between h-auto">

                    <!-- logo, navigation toggler -->
                    <div class="align-items-start">

                        <!-- sidebar toggler -->
                        <a href="#aside-main"
                            class="btn-sidebar-toggle h-100 d-inline-block d-lg-none justify-content-center align-items-center p-2">
                            <span>
                                <svg width="25" height="25" viewBox="0 0 20 20">
                                    <path
                                        d="M 19.9876 1.998 L -0.0108 1.998 L -0.0108 -0.0019 L 19.9876 -0.0019 L 19.9876 1.998 Z">
                                    </path>
                                    <path
                                        d="M 19.9876 7.9979 L -0.0108 7.9979 L -0.0108 5.9979 L 19.9876 5.9979 L 19.9876 7.9979 Z">
                                    </path>
                                    <path
                                        d="M 19.9876 13.9977 L -0.0108 13.9977 L -0.0108 11.9978 L 19.9876 11.9978 L 19.9876 13.9977 Z">
                                    </path>
                                    <path
                                        d="M 19.9876 19.9976 L -0.0108 19.9976 L -0.0108 17.9976 L 19.9876 17.9976 L 19.9876 19.9976 Z">
                                    </path>
                                </svg>
                            </span>
                        </a>

                        <!-- logo : mobile only -->
                        <a class="navbar-brand d-inline-block d-lg-none mx-2" href="dashboard.html">
                            <img data-org-logo src="https://ited.org.ec/img/ited.png" width="68" height="38" alt="AURA">
                        </a>
                    </div>

                    <!-- options -->
                    <ul class="list-inline list-unstyled mb-0 d-flex align-items-end">



                        <!-- account -->
                        <li class="list-inline-item mx-1 dropdown" id="account-dropdown" style="display: none;">

                            <!-- has avatar -->
                            <a href="#" id="dropdownAccountOptions"
                                class="btn btn-sm btn-icon btn-light dropdown-toggle rounded-circle shadow bg-cover"
                                style="background-image:url(assets/images/users_img/user.jpg)" data-bs-toggle="dropdown"
                                data-bs-auto-close="outside" aria-expanded="false" aria-haspopup="true"
                                aria-label="Account options"></a>



                            <div aria-labelledby="dropdownAccountOptions"
                                class="dropdown-menu dropdown-menu-clean dropdown-menu-navbar-autopos dropdown-menu-invert dropdown-fadeindown p-0 mt-2 w-300">

                                <!-- user detail -->
                                <div class="dropdown-header bg-primary bg-gradient rounded rounded-bottom-0 text-white small p-4"
                                    style="cursor: pointer;" onclick="window.location.href='profile.html'">
                                    <span id="user-name" class="d-block fw-medium text-truncate">Cargando...</span>
                                    <span id="user-email"
                                        class="d-block smaller fw-medium text-truncate">Cargando...</span>
                                    <span class="d-block smaller"><b>Last Login:</b> 2019-09-03 01:48</span>
                                </div>



                                <div class="dropdown-divider mb-3"></div>

                                <a href="#" class="dropdown-item text-truncate">
                                    <small class="badge bg-success-soft float-end">10 new</small>
                                    <span class="fw-medium">My Alerts</span>
                                    <small class="d-block text-muted smaller">inbox, projects, tasts</small>
                                </a>

                                <div class="dropdown-divider mb-0 mt-3"></div>
                                <a href="#" id="logout-btn" class="dropdown-item text-danger fw-bold">
                                    <i class="fi fi-power float-start"></i> Log Out
                                </a>
                            </div>
                        </li>
                    </ul>
                    <!-- /options -->

                </nav>
            </div>
            <!-- /Navbar -->
        </header>
        <!-- /Header -->

        <div id="wrapper_content" class="d-flex flex-fill">

            <!-- Sidebar -->
            <aside id="aside-main" class="aside-start aside-hide-xs bg-white shadow-sm d-flex flex-column px-2 h-auto">
                <div class="py-2 px-3 mb-3 mt-3">
                    <a href="dashboard.html">
                        <img data-org-logo src="https://ited.org.ec/img/ited.png" width="100" height="50" alt="...">
                    </a>
                    <span data-org-name class="small text-muted d-block mt-1"></span>
                </div>

                <div class="aside-wrapper scrollable-vertical scrollable-styled-light align-self-baseline h-100 w-100">
                    <nav class="nav-deep nav-deep-sm nav-deep-light js-ajaxified">
                        <ul id="dynamicMenu" class="nav flex-column"></ul>
                    </nav>
                </div>
            </aside>
            <!-- /Sidebar -->

            <!-- Main -->
            <main id="middle" class="flex-fill">
                <div class="container page-wrap">

                    <!-- Title -->
                    <header>
                        <h1 class="h4">Settings</h1>
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb small">
                                <li class="breadcrumb-item text-muted active" aria-current="page">Settings</li>
                            </ol>
                        </nav>
                    </header>

                    <!-- divider (old look) -->
                    <div class="border border-solid border-primary border-bottom-0 my-3"></div>

                    <!-- Academic criteria — collapsible card like old design -->
                    <div class="section p-xl-4 pt-0" data-admin-only>
                        <div class="card shadow-sm">
                            <button
                                class="card-header bg-transparent d-flex align-items-center justify-content-between w-100 text-start collapsed"
                                type="button" data-bs-toggle="collapse" data-bs-target="#criteriaCollapse"
                                aria-expanded="false">
                                <span class="fw-medium">Academic criteria</span>
                                <i class="fi fi-arrow-down"></i>
                            </button>

                            <div id="criteriaCollapse" class="collapse">
                                <div class="card-body">
                                    <form id="criteria-form" class="row g-3" autocomplete="off">
                                        <div class="col-md-4">
                                            <label class="form-label">Minimum Grade (%)</label>
                                            <input type="number" min="0" max="100" step="1" id="minGrade"
                                                class="form-control" placeholder="e.g., 50" />
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">Minimum Attendance (%)</label>
                                            <input type="number" min="0" max="100" step="1" id="minAttendance"
                                                class="form-control" placeholder="e.g., 75" />
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">Minimum GPA</label>
                                            <input type="number" min="0" max="4" step="0.01" id="minGPA"
                                                class="form-control" placeholder="e.g., 2.0" />
                                        </div>

                                        <div class="col-md-4">
                                            <label class="form-label">Passing Credits (per term)</label>
                                            <input type="number" min="0" step="1" id="passingCredits"
                                                class="form-control" placeholder="e.g., 12" />
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">Grace Assignments Allowed</label>
                                            <input type="number" min="0" step="1" id="graceAssignments"
                                                class="form-control" placeholder="e.g., 1" />
                                        </div>
                                        <div class="col-md-12">
                                            <label class="form-label">Notes / Policy</label>
                                            <textarea id="policyNotes" class="form-control" rows="3"
                                                placeholder="Late rules, exceptions, etc."></textarea>
                                        </div>

                                        <div class="col-12 d-flex gap-2">
                                            <button type="submit" class="btn btn-primary btn-sm">Save</button>
                                            <span id="criteria-save-status" class="small text-muted"></span>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Organization logo (admin only) -->
                    <div class="section p-xl-4 pt-0" data-admin-only>
                        <div class="card shadow-sm">
                            <div class="card-header bg-transparent fw-medium">Organization logo</div>
                            <div class="card-body d-flex align-items-center gap-3 flex-wrap">
                                <img id="org-logo-preview" data-org-logo src="assets/images/logo-placeholder.png"
                                    class="logo-preview" alt="Logo">

                                <input type="file" id="org-logo-file" accept="image/*" class="form-control"
                                    style="max-width:280px">
                                <button id="org-logo-save" class="btn btn-primary">Save logo</button>

                                <div class="progress mt-2 d-none flex-grow-1" id="org-progress-wrap"
                                    style="height:6px;min-width:200px">
                                    <div class="progress-bar" id="org-progress" style="width:0%"></div>
                                </div>
                                <small id="org-status" class="text-muted"></small>
                            </div>
                        </div>
                    </div>

                    <!-- Organization name (admin only) -->
                    <div class="section p-xl-4 pt-0" data-admin-only>
                        <div class="card shadow-sm">
                            <div class="card-header bg-transparent fw-medium">Organization name</div>
                            <div class="card-body d-flex align-items-center gap-3 flex-wrap">
                                <input type="text" id="org-name-input" class="form-control"
                                    placeholder="Organization name" style="max-width:320px">
                                <button id="org-name-save" class="btn btn-primary">Save name</button>
                                <small id="org-name-status" class="text-muted"></small>
                            </div>
                        </div>
                    </div>

                </div>
            </main>
            <!-- /Main -->
        </div><!-- /content -->

        <footer id="footer">
            <div class="p-3 bg-white shadow-sm rounded">
                <span class="small fw-medium">&copy; <span data-org-name>AURA</span></span>
            </div>
        </footer>
    </div><!-- /#wrapper -->


    <!-- Collapse arrow rotation (old behavior) -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const btn = document.querySelector('[data-bs-target="#criteriaCollapse"]');
            const icon = btn?.querySelector(".fi-arrow-down");
            const target = document.getElementById("criteriaCollapse");
            if (!btn || !icon || !target) return;
            target.addEventListener("show.bs.collapse", () => icon.classList.add("rotated"));
            target.addEventListener("hide.bs.collapse", () => icon.classList.remove("rotated"));
        });
    </script>
    <!-- Core javascripts -->
    <script src="assets/js/core.min.js"></script>
    <script src="assets/js/vendor_bundle.min.js"></script>

    <script src="js/upload_excel.js"></script>


    <!-- modules -->
    <script type="module">
        import "./js/firebase-config.js";
        import "./js/auth.js";
        import "./js/menu.js";
        import "./js/account.js";
        import "./js/setting.js";
    </script>
    <script type="module">
        import { auth } from "./js/firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "index.html";
            } else {
                document.getElementById("user-email").textContent = user.email;
                document.getElementById("user-name").textContent = user.displayName || "Usuario";
            }
        });

        document.getElementById("logout-btn").addEventListener("click", async (e) => {
            e.preventDefault();
            await signOut(auth);
            window.location.href = "index.html";
        });
    </script>
</body>

</html>
