<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <title>AURA - Student Risk Analysis</title>
    <meta name="description" content="AURA - Student Risk Analysis" />
    <meta name="viewport" content="width=device-width, maximum-scale=5, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/core.min.css" />
    <link rel="stylesheet" href="assets/css/vendor_bundle.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" />
    <link rel="shortcut icon" href="favicon.ico" />
    
    <!-- Styles for this page -->
    <style>
        .d-none { display: none !important; }
        .expand-icon { transition: transform 0.3s ease; }
        .expand-icon.rotated { transform: rotate(180deg); }
        .legend { display: flex; gap: 1rem; align-items: center; font-size: 12px; color: #6b7280; margin-bottom: 1rem; }
        .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; border: 2px solid currentColor; margin-right: 6px; vertical-align: -1px; }
        .actions { display: flex; gap: .5rem; }
        .docbtn { width: 60px; min-width: 60px; border: 1px solid #e5e7eb; border-radius: 10px; background: #fff; padding: .35rem .4rem; text-align: center; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.04); transition: all .2s ease; }
        .docbtn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,.08); }
        .docbtn .icon { width: 28px; height: 28px; margin: 0 auto 4px; display: grid; place-items: center; border-radius: 8px; border: 2px solid currentColor; font-weight: 700; line-height: 1; }
        .docbtn .label { font-size: 11px; line-height: 1.2; color: #374151; white-space: nowrap; }
        .risk { color: #7c3aed; } /* At-Risk - purple */
        .attn { color: #f59e0b; } /* Attendance - amber */
        .fail { color: #ef4444; } /* Failure - red */
        .avg { color: #3b82f6; } /* Low Term Avg - blue */
    </style>
</head>

<body class="layout-admin layout-padded aside-sticky">
    <div id="wrapper" class="d-flex align-items-stretch flex-column">

        <!-- Header (will be populated by your core JS) -->
        <header id="header" class="d-flex align-items-center bg-transparent"></header>

        <div id="wrapper_content" class="d-flex flex-fill">
            
            <!-- Sidebar (will be populated by menu.js) -->
            <aside id="aside-main" class="aside-start aside-hide-xs bg-white shadow-sm d-flex flex-column px-2 h-auto">
                <div class="py-2 px-3 mb-3 mt-3"><a href="dashboard.html"><img src="https://ited.org.ec/img/ited.png" width="100" height="50" alt="..."></a></div>
                <div class="aside-wrapper scrollable-vertical scrollable-styled-light align-self-baseline h-100 w-100">
                    <nav class="nav-deep nav-deep-sm nav-deep-light js-ajaxified"><ul id="dynamicMenu" class="nav flex-column"></ul></nav>
                </div>
            </aside>

            <main id="middle" class="flex-fill mx-auto">
                <div class="container-fluid">
                    <header class="mb-4">
                        <h1 class="h4">Student Risk Analysis</h1>
                        <p class="text-muted">Comprehensive analysis of at-risk students across all courses.</p>
                    </header>

                    <div class="section p-xl-4">
                        <div class="legend">
                            <span><i class="dot risk"></i>At-Risk</span>
                            <span><i class="dot attn"></i>Low Attendance</span>
                            <span><i class="dot fail"></i>Course Failure</span>
                            <span><i class="dot avg"></i>Low Term Avg</span>
                        </div>

                        <!-- Results Card -->
                        <div id="results-card" class="card shadow-sm d-none">
                            <div class="card-body">
                                <div class="row g-2 align-items-center mb-3">
                                    <div class="col-md-8">
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fi fi-search"></i></span>
                                            <input id="course-search" type="text" class="form-control" placeholder="Search by course, student, or program..." />
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="section p-3 bg-soft-danger rounded text-center">
                                            <h2 class="h6 text-danger mb-1">Total At-Risk Students</h2>
                                            <span class="fs-4 fw-bold text-danger" id="total-risk-count">0</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle">
                                        <thead class="small text-muted">
                                            <tr>
                                                <th>COURSE NAME</th>
                                                <th style="width:180px;">TOTAL STUDENTS</th>
                                                <th style="width:180px;">AT-RISK STUDENTS</th>
                                                <th class="text-end" style="width:130px;">EXPAND</th>
                                            </tr>
                                        </thead>
                                        <tbody id="analysis-tbody"></tbody>
                                    </table>
                                </div>
                                <div id="no-results-message" class="text-center text-muted border border-dashed rounded p-5 d-none">
                                    <div class="mb-2">😕 No results found.</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <footer id="footer"><div class="p-3 bg-white shadow-sm rounded"><span class="small fw-medium">&copy; AURA</span></div></footer>
    </div>

    <!-- Full Screen Loading Overlay -->
    <div id="screen-lock" style="display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255, 255, 255, 0.7); backdrop-filter: blur(4px); justify-content: center; align-items: center;">
        <div class="text-center">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
            <div id="loading-message" class="mt-3 fw-bold">Please wait...</div>
        </div>
    </div>

    <!-- Core & Vendor JS -->
    <script src="assets/js/core.min.js"></script>
    <script src="assets/js/vendor_bundle.min.js"></script>

    <!-- Page-specific Scripts -->
    <script type="module">
        import "./js/firebase-config.js";
        import "./js/auth.js";
        import "./js/menu.js";
        import "./js/alerts.js";
        import "./js/account.js";
        // This is your main script for this page
        import "./js/student_analysis.js"; 
    </script>
</body>
</html>
